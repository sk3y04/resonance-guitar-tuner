# Conservative resource caps: this host also runs a local inference service.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=4
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.code.style=official

# SDK workaround (2026-11-06): this machine's SDK repo snapshot tops out at
# platforms;android-36, but the Compose Multiplatform 1.12.2 android variant
# pulls Jetpack Compose 1.12.1 AARs with minCompileSdk=37. The official
# androidx flag disables the CheckAarMetadata task so the (code-only)
# dependency compiles against android-36. REMOVE THIS once the SDK repo
# offers platforms;android-37, then set compileSdk=37 in shared + androidApp.
android.experimental.disableCompileSdkChecks=true
